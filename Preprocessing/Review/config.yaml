execution:
  debug: false

analysis_keys:
  accuracy_key: false
  spikes_count_key: false
  firing_rate_single_key: false
  oscillations_key: false
  syn_matrix_trial_key: false
  syn_cats_key: false
  syn_activity_key: false
  dataset_similarity_key: false
  up_state_key: true
  synchronization_key: true
  sleep_reactivation_key: true

model:
  experiments:
    - config: startreview_mnist_fullplast
      input_model: mnist_hog324
    #- config: startreview_mnist_cxcxplast
    #  input_model: mnist_hog324
    #- config: startreview_cifar_fullplast
    #  input_model: cifar10_resnet324
    #- config: startreview_cifar_cxcxplast
    #  input_model: cifar10_resnet324
  prediction:
    - neuron
    - group
    - class
  train_example_shuffling: false
  remove_trials: []
  select_trials: []

paths:
  root_input_path: ./../Dataset/PreprocessedData
  root_save_path: /Users/mac/Documents/Projects/ThaCo3/GitHub/Output/thaco_revenge_review1st/Analysis/Data/gin
  root_loadpath: /Users/mac/Documents/Projects/ThaCo3/GitHub/Output/thaco_revenge_review1st/SimulationOutput/train_classes_10/train_example_3

network:
  n_areas: 1
  n_class: 10
  n_ranks_train: 3
  n_ranks_test: 25
  n_exc_ca: 20
  n_fov: 9
  coding: 4
  autapses: true

synapses:
  th_inh_exc: -1
  cx_inh_exc: -4

timing:
  t_img_train: 400
  t_img_test: 200
  t_pause: 400
  t_relaxation_test: 8000
  t_nrem_therm: 10000
  t_nrem: 100000

stages_id: [00_awake_training, 01_nrem, 02_nrem, 03_nrem, 04_nrem, 05_nrem, 06_nrem, 07_nrem, 08_nrem, 09_nrem, 10_nrem,
            11_nrem, 12_nrem, 13_nrem, 14_nrem, 15_nrem, 16_nrem, 17_nrem, 18_nrem, 19_nrem, 20_nrem]

firing_rate_single:
  dt_s_single:
    low: 0.1
    high: 0.1
  dt_ds_single:
    low: 5
    high: 1
  nu_t_high_single:
    low: 132
    high: 500
  nu_t_low_single:
    low: null
    high: null

oscillations:
  dt_fr: 50
  n_active: 15
  thresh_osc: 0.25
  sigma_t_osc_nrem: 1
  sigma_t_osc_awake: 1

dataset_similarity:
  max_features_per_class: 6000
  max_umap_samples: 6000
  seed: 42
  norm_factor: 81
  n_components: 2
  n_neighbors: 15
  min_dist: 0.1

up_state:
  population_firing_rate:
    dt_s: 0.1
    dt_ds: 1
    nu_t_high: 500
    nu_t_low: null
  detection:
    smooth_ms: 5
    min_up_duration_ms: 30
    threshold_hz: 0.5

synchronization:
  pairs:
    - [cx_exc, th_exc]
    - [cx_exc, cx_inh]
    - [th_exc, th_inh]
  event_padding_ms: 10

reactivation:
  firing_rate_single:
    dt_s_fr: 1
    dt_ds_fr: 10
    nu_t_high_fr: 50
    nu_t_low_fr: null
    event_padding_ms: 50
  representative_trial_id: 0Eo21Pgt50
  template_substage: learning
  analysis_substage: sleep
